
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Faculty Timetable Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #dbeafe, #f5eaff);
            color: #1e293b;
        }

        .card {
            width: 100%;
            max-width: 460px;
            padding: 36px;
            background: #fff;
            border-radius: 22px;
            box-shadow: 0 18px 55px rgba(45, 55, 120, 0.15);
        }

        .logo {
            width: 62px;
            height: 62px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 19px;
            background: linear-gradient(135deg, #6366f1, #9333ea);
            font-size: 30px;
        }

        h1 {
            margin: 0 0 12px;
            text-align: center;
            font-size: 27px;
            color: #1e1b4b;
        }

        .subtitle {
            margin: 0 0 28px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
            line-height: 1.7;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: #f8fafc;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.14);
            background: #fff;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 4px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .messages {
            margin-bottom: 18px;
        }

        .message {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 9px;
            background: #eef2ff;
            color: #4338ca;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
        }

        .footer a {
            color: #6366f1;
            font-weight: 600;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 22px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="logo">🔐</div>

        <h1>Choose a New Password</h1>

        <p class="subtitle">
            Create a new password for your account.
            Use at least 8 characters.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="messages">
                    {% for category, message in messages %}
                        <div class="message">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('reset_password', token=token) }}">
            <div class="form-group">
                <label for="password">New Password</label>
                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Enter your new password"
                    required
                    minlength="8"
                    autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input
                    id="confirm_password"
                    type="password"
                    name="confirm_password"
                    placeholder="Enter password again"
                    required
                    minlength="8"
                    autocomplete="new-password">
            </div>

            <button type="submit">Reset Password →</button>
        </form>

        <div class="footer">
            <a href="{{ url_for('login') }}">← Back to Login</a>
        </div>
    </main>
</body>
</html>
