
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Faculty Timetable Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #dbeafe, #f5eaff);
            color: #1e293b;
        }

        .signup-card {
            width: 100%;
            max-width: 460px;
            padding: 36px;
            background: white;
            border-radius: 22px;
            box-shadow: 0 18px 55px rgba(45, 55, 120, 0.15);
        }

        .logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background: linear-gradient(135deg, #6366f1, #9333ea);
            color: white;
            font-size: 28px;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 27px;
            color: #1e1b4b;
        }

        .subtitle {
            margin: 10px 0 28px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            background: #f8fafc;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.14);
            background: white;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            margin-top: 6px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .messages {
            margin-bottom: 18px;
        }

        .message {
            padding: 11px 13px;
            border-radius: 9px;
            background: #fff1f2;
            color: #be123c;
            font-size: 14px;
            margin-bottom: 8px;
            overflow-wrap: anywhere;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        .footer a {
            color: #6366f1;
            font-weight: 600;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .signup-card {
                padding: 26px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <main class="signup-card">
        <div class="logo">📚</div>

        <h1>Create Your Account</h1>
        <p class="subtitle">
            Join the Faculty Timetable Generator to get started.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="messages">
                    {% for category, message in messages %}
                        <div class="message">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('signup') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input
                    id="username"
                    type="text"
                    name="username"
                    placeholder="Choose a username"
                    required
                    minlength="3"
                    maxlength="50"
                    autocomplete="username">
            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                    autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="At least 8 characters"
                    required
                    minlength="8"
                    autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm password</label>
                <input
                    id="confirm_password"
                    type="password"
                    name="confirm_password"
                    placeholder="Enter password again"
                    required
                    minlength="8"
                    autocomplete="new-password">
            </div>

            <button type="submit" class="submit-btn">
                Create Account →
            </button>
        </form>

        <div class="footer">
            Already have an account?
            <a href="{{ url_for('login') }}">Back to Login</a>
        </div>
    </main>
</body>
</html>
